[package]
name = "aermet-tool"
version = "0.1.0"
edition = "2021"
description = "AERMET meteorological preprocessing automation tool"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
csv = "1"
zip = "2"
chrono = "0.4"
open = "5"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
regex = "1"
futures-util = "0.3"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
